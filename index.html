  }

  // Search bar
  let html = `
    <div class="search-bar stagger-1">
      <span class="search-icon">🔍</span>
      <input id="overview-search" placeholder="搜索主题..." value="${esc(state.overviewSearch)}"
             oninput="state.overviewSearch=this.value;filterOverview()">
    </div>
  `;

  // Filter chips
  const tags = getAllTags();
  const courses = Object.values(state.courses);
  const filterChips = [
    `<div class="filter-chip ${state.overviewFilter==='all'?'active':''}" onclick="setFilter('all')">全部</div>`,
    `<div class="filter-chip ${state.overviewFilter==='uncategorized'?'active':''}" onclick="setFilter('uncategorized')">未分类</div>`,
    ...courses.map(c => `<div class="filter-chip ${state.overviewFilter==='course:'+c.id?'active':''}" onclick="setFilter('course:${c.id}')"><span class="course-dot" style="background:${c.color};margin-right:3px"></span>${esc(c.name)}</div>`),
    ...tags.map(tag => `<div class="filter-chip ${state.overviewFilter==='tag:'+tag?'active':''}" onclick="setFilter('tag:${esc(tag)}')">#${esc(tag)}</div>`)
  ];
  html += `<div class="filter-row">${filterChips.join('')}</div>`;

  // Filter topics
  let filteredTopics = topics;
  if (state.overviewSearch) {
    const q = state.overviewSearch.toLowerCase();
    filteredTopics = filteredTopics.filter(t => t.name.toLowerCase().includes(q));
  }
  if (state.overviewFilter === 'uncategorized') {
    filteredTopics = filteredTopics.filter(t => !t.courseId);
  } else if (state.overviewFilter.startsWith('course:')) {
    const cid = state.overviewFilter.substring(7);
    filteredTopics = filteredTopics.filter(t => t.courseId === cid);

    const tag = state.overviewFilter.substring(4);
    filteredTopics = filteredTopics.filter(t => (t.tags || []).includes(tag));
  }

  // Sort by mastery
  filteredTopics.sort((a, b) => getTopicMastery(b.id) - getTopicMastery(a.id));

  // Radar chart (if 3+ topics)
  if (filteredTopics.length >= 3) {
    html += renderRadarChart(filteredTopics.slice(0, 8));
  }

  // Topic list
  html += `<div class="section-title">主题掌握度 <span class="st-action" onclick="setFilter('all');state.overviewSearch='';navigate('overview')">清除筛选</span></div>`;
  if (filteredTopics.length > 0) {
    html += `<div class="card" style="padding:12px">`;
    html += filteredTopics.map((t, i) => {
      const mastery = getTopicMastery(t.id);
      const tests = getTopicTests(t.id);
      const lastTest = tests[tests.length-1];
      const course = t.courseId ? state.courses[t.courseId] : null;
      return `
        <div class="topic-item stagger-${Math.min(i+1,6)}" onclick="navigateToTopic('${t.id}')">
          <div class="topic-icon" style="background:${mastery >= 80 ? 'var(--success-light)' : mastery >= 50 ? 'var(--accent-light)' : 'var(--danger-light)'}">
            ${masteryEmoji(mastery)}
          </div>
          <div class="topic-info">
            <div class="topic-name">${esc(t.name)}</div>
            <div class="topic-meta">
              ${course ? `<span class="course-badge"><span class="course-dot" style="background:${course.color}"></span>${esc(course.name)}</span>` : ''}
              ${tests.length > 0 ? `${tests.length} 次 · ${formatDate(lastTest.date)}` : '未测试'}
            </div>
          </div>
          <div class="mastery-bar"><div class="mastery-fill" style="width:${mastery}%;background:${scoreColor(mastery)}"></div></div>
          <div class="mastery-num" style="color:${scoreColor(mastery)}">${mastery}</div>
        </div>
      `;
    }).join('');
    html += `</div>`;
  } else {
    html += `<div class="card"><div class="empty-state"><div class="emoji">🔍</div><div class="text">没有匹配的主题</div></div></div>`;
  }

  // Recent tests
  const recent = allTests.sort((a,b) => b.date - a.date).slice(0, 10);
  if (recent.length > 0) {
    html += `<div class="section-title">检测历史</div>`;
    html += `<div class="card" style="padding:12px">`;
    html += recent.map(t => `
      <div class="topic-item" style="margin-bottom:0;cursor:pointer" onclick="navigateToTopic('${t.topicId}')">
        <div class="topic-icon" style="background:var(--card-2);width:32px;height:32px;font-size:14px">
          ${t.type === 'feynman' ? '💡' : t.type === 'recall' ? '🧠' : '🎯'}
        </div>
        <div class="topic-info">
          <div class="topic-name" style="font-size:13px">${esc(t.topicName)}</div>
          <div class="topic-meta"><span class="tag tag-${t.type}" style="font-size:10px">${typeName(t.type)}</span> ${formatDate(t.date)}</div>
        </div>
        <div style="font-size:16px;font-weight:800;color:${scoreColor(t.score)}">${t.score}</div>
      </div>
    `).join('');
    html += `</div>`;
  }

  return html;
}

/* ============================================================
   RADAR CHART
   ============================================================ */
function renderRadarChart(topics) {
  const n = topics.length;
  const cx = 130, cy = 130, maxR = 90;
  const angles = topics.map((t, i) => (i / n) * Math.PI * 2 - Math.PI / 2);

  // Grid circles
  let gridCircles = '';
  for (let r = 0.25; r <= 1; r += 0.25) {
    const points = angles.map(a => `${cx + Math.cos(a) * maxR * r},${cy + Math.sin(a) * maxR * r}`).join(' ');
    gridCircles += `<polygon points="${points}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  }
  // Grid lines
  let gridLines = angles.map(a =>
    `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a) * maxR}" y2="${cy + Math.sin(a) * maxR}" stroke="var(--border)" stroke-width="1"/>`
  ).join('');

  // Data polygon
  const dataPoints = topics.map((t, i) => {
    const mastery = getTopicMastery(t.id);
    const r = (mastery / 100) * maxR;
    return `${cx + Math.cos(angles[i]) * r},${cy + Math.sin(angles[i]) * r}`;
  }).join(' ');

  // Labels
  const labels = topics.map((t, i) => {
    const mastery = getTopicMastery(t.id);
    const lr = maxR + 16;
    const lx = cx + Math.cos(angles[i]) * lr;
    const ly = cy + Math.sin(angles[i]) * lr;
    const name = t.name.length > 6 ? t.name.slice(0,6)+'...' : t.name;
    return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="var(--text-2)" font-weight="600">${esc(name)}</text>
            <text x="${lx}" y="${ly+12}" text-anchor="middle" font-size="9" fill="${scoreColor(mastery)}" font-weight="700">${mastery}</text>`;
  }).join('');

  return `
    <div class="radar-chart stagger-2">
      <div class="radar-chart-title">📊 掌握度雷达图</div>
      <svg viewBox="0 0 260 260">
        ${gridCircles}
        ${gridLines}
        <polygon points="${dataPoints}" fill="rgba(99,102,241,.15)" stroke="var(--primary)" stroke-width="2"/>
        ${topics.map((t, i) => {
          const mastery = getTopicMastery(t.id);
          const r = (mastery / 100) * maxR;
          return `<circle cx="${cx + Math.cos(angles[i]) * r}" cy="${cy + Math.sin(angles[i]) * r}" r="4" fill="var(--card)" stroke="${scoreColor(mastery)}" stroke-width="2"/>`;
        }).join('')}
        ${labels}
      </svg>
    </div>
  `;
}

        <div style="display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--text-3)">
          <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></span>费曼</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--primary)"></span>回忆</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--success)"></span>闯关</span>

    ` : ''}

    ${historyTable}

    <!-- Detailed test records -->
    ${tests.length > 0 ? `
      <div class="section-title">详细记录</div>
      ${tests.slice().reverse().map((t, i) => `
        <div class="card stagger-${Math.min(i+1,6)}">
          <div class="flex-between mb-8">
            <div style="display:flex;align-items:center;gap:8px">

              <div>
                <div style="font-size:14px;font-weight:700"><span class="tag tag-${t.type}">${typeName(t.type)}</span></div>
                <div class="text-xs text-faint">${formatDateFull(t.date)} · 用时 ${Math.round(t.duration/60)}:${String(t.duration%60).padStart(2,'0')}</div>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-size:24px;font-weight:800;color:${scoreColor(t.score)}">${t.score}</div>
              <div class="text-xs text-faint">${masteryLabel(t.score)}</div>
            </div>
          </div>

            <div style="background:var(--card-2);border-radius:var(--radius-xs);padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:150px;overflow-y:auto;border:1px solid var(--border);margin-top:8px">
              ${esc(t.explanation)}
            </div>
          ` : ''}
          ${t.type === 'recall' && t.subtopics ? `
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">
              ${t.subtopics.map(s => `
                <span class="chip" style="font-size:11px;${s.grade==='good'?'border-color:var(--success);color:var(--success)':s.grade==='mid'?'border-color:var(--accent);color:var(--accent)':'border-color:var(--danger);color:var(--danger)'}">
                  ${s.grade==='good'?'✅':s.grade==='mid'?'🤔':'❌'} ${esc(s.name)}

              `).join('')}
            </div>
          ` : ''}
          ${t.type === 'quiz' && t.details ? `
            <div style="margin-top:8px">
              ${t.details.map((d,i) => `
                <div style="font-size:12px;padding:4px 0;display:flex;gap:6px">
                  <span>${d.grade==='good'?'✅':d.grade==='mid'?'🤔':'❌'}</span>
                  <span class="text-muted">${esc(d.q.slice(0,40))}${d.q.length>40?'...':''}</span>

    <div class="card">
      <div class="section-title" style="margin-top:0">🏷 标签管理</div>
      <div class="chip-list">
        ${(topic.tags || []).map(tag => `
          <span class="chip">#${esc(tag)} <span class="chip-remove" onclick="removeTag('${topic.id}','${esc(tag)}')">×</span></span>
        `).join('') || '<span class="text-faint text-sm">暂无标签</span>'}

      <div style="display:flex;gap:8px;margin-top:12px">
        <input class="form-input" id="new-tag-${topic.id}" placeholder="输入标签名" style="font-size:14px"

        <button class="btn btn-secondary btn-sm" onclick="addTag('${topic.id}')">添加</button>
      </div>
    </div>

    ${course ? `
      <div class="card">
        <div class="flex-between">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="course-dot" style="background:${course.color};width:14px;height:14px"></span>
            <span class="text-sm">所属课程：<strong>${esc(course.name)}</strong></span>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="unlinkTopic('${topic.id}')">解除关联</button>
        </div>
      </div>

      <div class="card">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">关联到课程（可选）</label>
          <select class="form-input" style="cursor:pointer" onchange="linkTopicToCourse('${topic.id}',this.value)">
            <option value="">选择课程...</option>
            ${Object.values(state.courses).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}

    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="navigate('overview')">返回全景</button>
      <button class="btn btn-primary" style="flex:1" onclick="quickRetest('${topic.id}','${tests[tests.length-1]?.type || 'feynman'}')">再测一次</button>
    </div>
  `;
}

function deleteTest(topicId, testId) {
  showModal('删除记录', '确定删除这条检测记录吗？', [
    { label: '取消', cls: 'btn-secondary' },
    { label: '删除', cls: 'btn-danger', onClick: () => {
      const topic = state.topics[topicId];
      if (topic) {
        topic.tests = topic.tests.filter(t => t.id !== testId);
        saveState();
        navigate('topicDetail');
        toast('记录已删除');
      }
    }}
  ]);
}

function addTag(topicId) {
  const input = document.getElementById('new-tag-' + topicId);
  if (!input) return;
  const tag = input.value.trim();
  if (!tag) return;
  const topic = state.topics[topicId];
  if (!topic.tags) topic.tags = [];
  if (topic.tags.includes(tag)) { toast('标签已存在'); return; }
  topic.tags.push(tag);
  saveState();
  navigate('topicDetail');
  toast('标签已添加');
}

function removeTag(topicId, tag) {
  const topic = state.topics[topicId];
  if (topic.tags) {
    topic.tags = topic.tags.filter(t => t !== tag);
    saveState();
    navigate('topicDetail');
  }
}

function linkTopicToCourse(topicId, courseId) {
  if (!courseId) return;
  state.topics[topicId].courseId = courseId;
  saveState();
  navigate('topicDetail');
  toast('已关联到课程');
}

function unlinkTopic(topicId) {
  state.topics[topicId].courseId = null;
  saveState();
  navigate('topicDetail');
  toast('已解除关联');
}

/* ============================================================
   DATA EXPORT/IMPORT
   ============================================================ */
function exportData() {
  const data = JSON.stringify({
    topics: state.topics, quizzes: state.quizzes,
    courses: state.courses, semesters: state.semesters
  }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `selftest_v3_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.topics) Object.assign(state.topics, data.topics);
        if (data.quizzes) Object.assign(state.quizzes, data.quizzes);
        if (data.courses) Object.assign(state.courses, data.courses);
        if (data.semesters) state.semesters = data.semesters;
        saveState();
        navigate('settings');
        toast('数据导入成功');
      } catch(err) {
        toast('导入失败：文件格式错误');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearAllData() {
  showModal('清空所有数据', '确定清空所有检测记录、主题、课程和数据吗？此操作不可撤销。建议先导出备份。', [
    { label: '取消', cls: 'btn-secondary' },
    { label: '清空', cls: 'btn-danger', onClick: () => {
      state.topics = {};
      state.quizzes = {};
      state.courses = {};
      state.semesters = [{ id: 'default', name: '默认学期' }];
      saveState();
      navigate('settings');
      toast('数据已清空');
    }}
  ]);
}

/* ============================================================
   HELPERS
   ============================================================ */
function getNextStep(score, type) {
  if (score >= 85) {
    return `🎉 太棒了！你已经真正掌握了这个主题。<br><br>建议：试试用另一种方法再检验一次（比如用「${type === 'feynman' ? '主动回忆' : '费曼讲解法'}」），或者把范围扩大，检验更深入的知识点。`;
  }
  if (score >= 65) {
    return `👍 基本掌握了，但还有提升空间。<br><br>建议：找到你没答好的部分，重新学习后再测一次。间隔一两天再测效果更好——遗忘曲线会帮你巩固长期记忆。`;
  }
  if (score >= 40) {
    return `🤔 还需要继续努力。<br><br>建议：先回去把基础概念重新学一遍，重点理解「为什么」而不只是「是什么」。学完后再来做一次检测。`;
  }
  return `❌ 看起来这个主题还没真正掌握。<br><br>别灰心，知道哪里不会就是进步的开始！建议：从头系统学习一遍。`;
}

/* ============================================================
   INIT — 云端版启动流程
   ============================================================ */
async function init() {
  loadStateLocal();
  applyTheme();

  // 初始化 Supabase
  const hasCloud = initSupabase();

  if (hasCloud) {
    // 检查是否有已保存的登录会话
    const user = await checkAuth();
    if (user) {
      // 已登录，拉取云端数据
      isOnlineMode = true;
      await cloudPullAll();
      applyTheme();
      navigate('home');
      updateUserInfo();
    } else {
      // 未登录，显示登录页
      loadStateLocal();
      navigate('home');
      showAuthOverlay();
    }
  } else {
    // 没配置云端，离线模式
    navigate('home');
  }
}

// 退出登录
async function handleLogout() {
  await signOut();
  isOnlineMode = false;
  // 清空本地数据，避免下一个用户看到
  state.topics = {};
  state.quizzes = {};
  state.courses = {};
  state.semesters = [{ id: 'default', name: '默认学期' }];
  saveStateLocal();
  navigate('home');
  showAuthOverlay();
  toast('已退出登录');
}

window.addEventListener('popstate', () => {
  if (state.currentView !== 'home') navigate('home');
});

init();
</script>
