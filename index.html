<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>学会了吗？— 自我检测工具 V3</title>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}

/* ============================================================
   THEME VARIABLES
   ============================================================ */
:root{
  --bg:#f0f2f5;
  --bg-grad:linear-gradient(160deg,#e0e7ff 0%,#f0f2f5 35%,#fef3c7 100%);
  --card:#ffffff; --card-2:#f8fafc; --card-glass:rgba(255,255,255,.7);
  --text:#1e293b; --text-2:#64748b; --text-3:#94a3b8;
  --primary:#6366f1; --primary-d:#4f46e5; --primary-light:#eef2ff;
  --primary-grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  --accent:#f59e0b; --accent-light:#fef3c7;
  --success:#10b981; --success-light:#d1fae5;
  --danger:#ef4444; --danger-light:#fee2e2;
  --info:#06b6d4; --info-light:#cffafe;
  --pink:#ec4899; --pink-light:#fce7f3;
  --border:#e2e8f0; --border-2:#cbd5e1;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(99,102,241,.15);
  --shadow-glow:0 0 0 4px rgba(99,102,241,.08);
  --radius:18px; --radius-sm:12px; --radius-xs:8px;
  --nav-h:64px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{
  --bg:#0f172a;
  --bg-grad:linear-gradient(160deg,#1e1b4b 0%,#0f172a 40%,#1a1a2e 100%);
  --card:#1e293b; --card-2:#334155; --card-glass:rgba(30,41,59,.8);
  --text:#f1f5f9; --text-2:#94a3b8; --text-3:#64748b;
  --primary:#818cf8; --primary-d:#6366f1; --primary-light:#312e81;
  --primary-grad:linear-gradient(135deg,#818cf8,#a78bfa);
  --accent:#fbbf24; --accent-light:#422006;
  --success:#34d399; --success-light:#064e3b;
  --danger:#f87171; --danger-light:#7f1d1d;
  --info:#22d3ee; --info-light:#083344;
  --pink:#f472b6; --pink-light:#500724;
  --border:#334155; --border-2:#475569;
  --shadow-xs:0 1px 2px rgba(0,0,0,.2);
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
  --shadow-md:0 4px 12px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
  --shadow-glow:0 0 0 4px rgba(129,140,248,.1);
}

/* ============================================================
   AUTH OVERLAY & SYNC INDICATOR
   ============================================================ */
.auth-overlay{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(160deg,#e0e7ff 0%,#f0f2f5 35%,#fef3c7 100%);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .3s ease;
}
[data-theme="dark"] .auth-overlay{
  background:linear-gradient(160deg,#1e1b4b 0%,#0f172a 40%,#1a1a2e 100%);
}
.auth-card{
  background:var(--card);border-radius:24px;padding:40px 32px;
  width:100%;max-width:380px;box-shadow:var(--shadow-lg);
  text-align:center;animation:slideUp .4s var(--ease-spring);
}
.auth-logo{font-size:48px;margin-bottom:12px}
.auth-title{font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px}
.auth-subtitle{font-size:14px;color:var(--text-2);margin-bottom:24px}
.auth-tabs{
  display:flex;gap:4px;background:var(--card-2);border-radius:12px;
  padding:4px;margin-bottom:24px;
}
.auth-tab{
  flex:1;padding:10px;border:none;background:transparent;border-radius:8px;
  font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer;
  transition:all .2s;
}
.auth-tab.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-xs)}
.auth-tab:active{transform:scale(.97)}
.auth-error{
  background:var(--danger-light);color:var(--danger);
  padding:10px 14px;border-radius:10px;font-size:13px;
  margin-bottom:12px;animation:shake .3s ease;
}
.auth-submit-btn{width:100%;padding:14px;font-size:15px}
.auth-footer{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.sync-indicator{
  position:fixed;top:8px;right:50%;transform:translateX(50%);
  z-index:9000;background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:6px 16px;font-size:12px;color:var(--text-2);
  display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-xs);
  animation:slideDown .3s ease;white-space:nowrap;
}
.sync-dot{
  width:8px;height:8px;border-radius:50%;background:var(--primary);
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg-grad);
  background-attachment:fixed;
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  padding-bottom:calc(var(--nav-h) + 24px);
  transition:background .4s,color .3s;
  -webkit-font-smoothing:antialiased;
}
input,textarea,button,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea{background:transparent;border:none;outline:none;width:100%}
textarea{resize:vertical;min-height:120px;line-height:1.7}

/* ============================================================
   LAYOUT
   ============================================================ */
#app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

/* ============================================================
   HEADER
   ============================================================ */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 4px 20px;
}
.app-title{
  font-size:24px;font-weight:800;letter-spacing:-.8px;
  display:flex;align-items:center;gap:2px;
}
.app-title .accent{
  background:var(--primary-grad);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.app-title .ver{
  font-size:10px;font-weight:600;color:var(--text-3);
  background:var(--card);padding:2px 8px;border-radius:20px;margin-left:6px;
  box-shadow:var(--shadow-xs);
}
.theme-toggle{
  width:40px;height:40px;border-radius:50%;
  background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:transform .3s var(--ease-spring);
}
.theme-toggle:active{transform:scale(.85) rotate(180deg)}

/* ============================================================
   CARDS
   ============================================================ */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-bottom:14px;
  transition:box-shadow .3s,transform .2s var(--ease-out);
}
.card.clickable{cursor:pointer}
.card.clickable:active{transform:scale(.98)}

/* ============================================================
   HERO CARD
   ============================================================ */
.hero-card{
  background:var(--primary-grad);border-radius:var(--radius);
  padding:26px 22px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);margin-bottom:14px;
}
.hero-card::after{
  content:'';position:absolute;top:-30px;right:-30px;
  width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.1);
}
.hero-card::before{
  content:'';position:absolute;bottom:-40px;left:-15px;
  width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,.07);
}
.hero-card h2{font-size:20px;margin-bottom:6px;position:relative;z-index:1;font-weight:800}
.hero-card p{font-size:13px;opacity:.88;position:relative;z-index:1}
.hero-card .hero-emoji{position:relative;z-index:1;font-size:28px;display:block;margin-bottom:4px}

/* ============================================================
   STATS
   ============================================================ */
.stats-row{display:flex;gap:10px;margin-bottom:14px}
.stat-card{
  flex:1;background:var(--card);border-radius:var(--radius-sm);
  padding:16px 12px;text-align:center;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--stat-color,var(--primary));
}
.stat-num{font-size:26px;font-weight:800;letter-spacing:-1px}
.stat-label{font-size:11px;color:var(--text-2);margin-top:2px}

/* Weekly summary card */
.weekly-card{
  background:var(--card);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px;
  display:flex;align-items:center;gap:16px;
}
.weekly-ring{
  width:56px;height:56px;position:relative;flex-shrink:0;
}
.weekly-ring svg{transform:rotate(-90deg)}
.weekly-ring .ring-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:14px;font-weight:800;
}
.weekly-info{flex:1}
.weekly-title{font-size:14px;font-weight:700}
.weekly-detail{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.5}
.weekly-bars{display:flex;gap:3px;margin-top:8px;height:24px;align-items:flex-end}
.weekly-bar{
  flex:1;border-radius:2px;min-height:3px;
  background:var(--border);transition:height .4s var(--ease-out);
}
.weekly-bar.has-data{background:var(--primary);opacity:.6}
.weekly-bar.today{background:var(--primary);opacity:1}
.weekly-bar-labels{display:flex;gap:3px;margin-top:2px}
.weekly-bar-label{flex:1;text-align:center;font-size:8px;color:var(--text-3)}

/* ============================================================
   SECTION TITLE
   ============================================================ */
.section-title{
  font-size:14px;font-weight:700;color:var(--text-2);
  margin:20px 0 10px;padding-left:4px;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px;
}
.section-title::before{
  content:'';width:4px;height:14px;border-radius:2px;
  background:var(--primary-grad);
}
.section-title .st-action{
  margin-left:auto;font-size:12px;font-weight:600;color:var(--primary);
  cursor:pointer;
}

/* ============================================================
   MODE GRID
   ============================================================ */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mode-card{
  background:var(--card);border-radius:var(--radius);padding:18px 16px;
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .2s var(--ease-out),box-shadow .3s;
  position:relative;overflow:hidden;
}
.mode-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.mode-card:active{transform:scale(.97)}
.mode-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:var(--mode-accent,var(--primary));opacity:0;transition:opacity .3s;
}
.mode-card:hover::after{opacity:1}
.mode-icon{font-size:32px;margin-bottom:8px;display:block}
.mode-name{font-size:15px;font-weight:700}
.mode-desc{font-size:11px;color:var(--text-2);margin-top:3px;line-height:1.4}
.mode-tag{
  position:absolute;top:12px;right:12px;
  font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;
}

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.form-input,.form-textarea{
  background:var(--card-2);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;width:100%;
  font-size:15px;transition:border-color .2s,background .2s,box-shadow .2s;
}
.form-input:focus,.form-textarea:focus{
  border-color:var(--primary);background:var(--card);
  box-shadow:var(--shadow-glow);
}
.form-textarea{min-height:100px;line-height:1.7}
.form-hint{font-size:12px;color:var(--text-3);margin-top:4px}

/* Writing prompt */
.writing-prompt{
  background:var(--accent-light);border-radius:var(--radius-sm);
  padding:10px 14px;font-size:12px;color:var(--accent);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
  border:1px solid rgba(245,158,11,.2);
}
.writing-prompt .prompt-icon{flex-shrink:0}

/* Word count */
.word-count-bar{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--text-3);margin-top:6px;padding:0 2px;
}
.word-count-bar .wc-num{font-weight:600;color:var(--text-2)}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 24px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;
  transition:transform .12s var(--ease-spring),opacity .2s,box-shadow .2s;width:100%;
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.96)}
.btn-primary{
  background:var(--primary-grad);color:#fff;
  box-shadow:0 4px 14px rgba(99,102,241,.3);
}
.btn-primary:hover{box-shadow:0 6px 20px rgba(99,102,241,.4)}
.btn-secondary{background:var(--card-2);color:var(--text);border:1.5px solid var(--border)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-sm{padding:8px 16px;font-size:13px;width:auto}
.btn:disabled{opacity:.4;pointer-events:none}

/* ============================================================
   TAGS & CHIPS
   ============================================================ */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.tag-feynman{background:var(--accent-light);color:var(--accent)}
.tag-recall{background:var(--primary-light);color:var(--primary)}
.tag-quiz{background:var(--success-light);color:var(--success)}

.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;padding:5px 10px;border-radius:20px;
  background:var(--card-2);border:1px solid var(--border);
  transition:border-color .2s;
}
.chip[style*="cursor:pointer"]:hover{border-color:var(--primary)}
.chip-remove{cursor:pointer;color:var(--text-3);font-size:14px;line-height:1}
.chip-remove:hover{color:var(--danger)}

/* Course color dot */
.course-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.course-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;
  background:var(--card-2);border:1px solid var(--border);
}

/* ============================================================
   FEYNMAN CHECKLIST
   ============================================================ */
.feynman-checklist{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.check-item{
  display:flex;align-items:center;gap:10px;padding:14px;
  background:var(--card-2);border-radius:var(--radius-sm);
  border:1.5px solid var(--border);cursor:pointer;
  transition:border-color .2s,background .2s,transform .15s var(--ease-out);
}
.check-item:hover{border-color:var(--primary)}
.check-item:active{transform:scale(.98)}
.check-item.checked{border-color:var(--success);background:var(--success-light)}
.check-circle{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:all .2s var(--ease-spring);
}
.check-item.checked .check-circle{border-color:var(--success);background:var(--success);color:#fff;transform:scale(1.1)}
.check-text{font-size:14px;line-height:1.5}
.check-item.checked .check-text{color:var(--success);text-decoration:line-through;opacity:.7}

/* ============================================================
   TIMER & PROGRESS
   ============================================================ */
.timer-bar{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;
  background:var(--card-2);padding:8px 12px;border-radius:var(--radius-xs);
}
.timer-dot{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.timer-dot.active{background:var(--danger);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--primary-grad);border-radius:3px;transition:width .5s var(--ease-out)}

/* ============================================================
   RECALL
   ============================================================ */
.recall-step-indicator{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s var(--ease-out)}
.step-dot.active{width:24px;border-radius:4px;background:var(--primary)}
.step-dot.done{background:var(--success)}
.step-dot.uncertain{background:var(--accent)}

.recall-prompt-box{
  background:var(--primary-light);padding:16px;border-radius:var(--radius-sm);
  margin-bottom:16px;border-left:4px solid var(--primary);
}
.recall-prompt-box .prompt-label{font-size:11px;color:var(--text-3);margin-bottom:4px}
.recall-prompt-box .prompt-text{font-size:18px;font-weight:700;color:var(--primary)}

.recall-display-box{
  background:var(--card-2);border-radius:var(--radius-sm);padding:16px;
  margin-bottom:12px;border:1px solid var(--border);position:relative;
}
.recall-display-box .box-label{font-size:11px;color:var(--text-3);margin-bottom:6px}
.recall-display-box .box-content{font-size:14px;line-height:1.7;white-space:pre-wrap}

/* ============================================================
   GRADE BUTTONS
   ============================================================ */
.grade-buttons{display:flex;gap:8px;margin-top:14px}
.grade-btn{
  flex:1;padding:14px 8px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  border:2px solid var(--border);background:var(--card);
  transition:all .2s var(--ease-out);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;
}
.grade-btn:hover{transform:translateY(-2px)}
.grade-btn:active{transform:scale(.95)}
.grade-btn .grade-emoji{font-size:24px}
.grade-btn.grade-good{border-color:var(--success);color:var(--success)}
.grade-btn.grade-good:hover{background:var(--success-light)}
.grade-btn.grade-mid{border-color:var(--accent);color:var(--accent)}
.grade-btn.grade-mid:hover{background:var(--accent-light)}
.grade-btn.grade-bad{border-color:var(--danger);color:var(--danger)}
.grade-btn.grade-bad:hover{background:var(--danger-light)}

/* ============================================================
   QUIZ
   ============================================================ */
.quiz-question{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:12px}
.quiz-answer-ref{
  background:var(--card-2);border-left:4px solid var(--primary);
  padding:14px;border-radius:0 var(--radius-xs) var(--radius-xs) 0;
  font-size:14px;line-height:1.7;white-space:pre-wrap;
}

/* ============================================================
   RESULTS
   ============================================================ */
.result-hero{
  text-align:center;padding:32px 20px;border-radius:var(--radius);
  margin-bottom:16px;position:relative;overflow:hidden;
}
.result-hero::after{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.result-hero h2{font-size:28px;font-weight:800;margin-bottom:6px;position:relative;z-index:1}
.result-hero p{font-size:14px;opacity:.85;position:relative;z-index:1}
.result-ring{
  width:110px;height:110px;margin:0 auto 14px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.result-ring svg{transform:rotate(-90deg)}
.result-ring .ring-num{
  position:absolute;font-size:30px;font-weight:800;
}
.result-stats{display:flex;gap:10px;margin-bottom:16px}
.result-stat{
  flex:1;background:var(--card);border-radius:var(--radius-sm);
  padding:14px;text-align:center;box-shadow:var(--shadow);
}
.result-stat .num{font-size:20px;font-weight:800}
.result-stat .label{font-size:11px;color:var(--text-2);margin-top:2px}

/* ============================================================
   OVERVIEW - TOPIC LIST
   ============================================================ */
.topic-item{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--card-2);border-radius:var(--radius-sm);margin-bottom:8px;
  border:1px solid var(--border);transition:border-color .2s,transform .15s var(--ease-out);
  cursor:pointer;
}
.topic-item:hover{border-color:var(--primary);transform:translateX(2px)}
.topic-item:active{transform:scale(.98)}
.topic-icon{
  width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.topic-info{flex:1;min-width:0}
.topic-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

<!-- 同步状态指示器 -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ============================================================
   CLOUD SYNC LAYER — Supabase 集成
   ============================================================ */
let supabase = null;
let currentUser = null;
let syncTimer = null;
let isOnlineMode = false;

function initSupabase() {
  if (typeof SUPABASE_URL === 'undefined' || SUPABASE_URL.includes('在这里粘贴')) {
    console.warn('[Cloud] config.js 未配置，将使用离线模式');
    return false;
  }
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  } catch(e) {
    console.error('[Cloud] Supabase 初始化失败:', e);
    return false;
  }
}

// 检查登录状态
async function checkAuth() {
  if (!supabase) return null;
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    return session.user;
  }
  return null;
}

// 注册
async function signUp(email, password) {
  const { data, error } = await supabase.auth.signUp({ email, password });
  if (error) throw error;
  return data;
}

// 登录
async function signIn(email, password) {
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return data;
}

// 退出
async function signOut() {
  if (supabase) await supabase.auth.signOut();
  currentUser = null;
  isOnlineMode = false;
}

/* ----- 云端数据同步 ----- */

// 推送全部本地数据到云端
async function cloudPushAll() {
  if (!supabase || !currentUser) return;
  showSyncIndicator(true);
  try {
    const uid = currentUser.id;

    // Push semesters
    for (const sem of state.semesters) {
      if (!sem.id || sem.id === 'default') continue;
      await supabase.from('semesters').upsert({
        id: sem.id, user_id: uid, name: sem.name,
        start_date: sem.startDate || null, end_date: sem.endDate || null
      });
    }

    // Push courses
    for (const cid in state.courses) {
      const c = state.courses[cid];
      await supabase.from('courses').upsert({
        id: c.id, user_id: uid, name: c.name,
        semester_id: c.semester || null, color: c.color || '#6366f1',
        exam_date: c.examDate || null, notes: c.notes || ''
      });
    }

    // Push topics (without tests)
    for (const tid in state.topics) {
      const t = state.topics[tid];
      await supabase.from('topics').upsert({
        id: t.id, user_id: uid, name: t.name,
        tags: t.tags || [], course_id: t.courseId || null,
        created_at: new Date(t.createdAt || Date.now()).toISOString()
      });

      // Push tests for this topic
      if (t.tests) {
        for (const test of t.tests) {
          await supabase.from('tests').upsert({
            id: test.id, user_id: uid, topic_id: t.id,
            type: test.type, score: test.score,
            duration: test.duration || 0,
            explanation: test.explanation || null,
            checks: test.checks || null,
            subtopics: test.subtopics || null,
            details: test.details || null,
            date: test.date
          });
        }
      }
    }

    // Push quizzes
    for (const qid in state.quizzes) {
      const q = state.quizzes[qid];
      await supabase.from('quizzes').upsert({
        id: q.id, user_id: uid, name: q.name,
        questions: q.questions
      });
    }

    // Push settings
    await supabase.from('user_settings').upsert({
      user_id: uid, dark_mode: state.theme === 'dark',
      has_seen_welcome: state.hasSeenWelcome
    });

    showSyncIndicator(false);
  } catch(e) {
    console.error('[Cloud] Push failed:', e);
    showSyncIndicator(false, '同步失败');
  }
}

// 从云端拉取全部数据
async function cloudPullAll() {
  if (!supabase || !currentUser) return false;
  showSyncIndicator(true);
  try {
    const uid = currentUser.id;

    // Pull semesters
    const { data: semesters } = await supabase.from('semesters').select('*').eq('user_id', uid);
    state.semesters = (semesters || []).map(s => ({
      id: s.id, name: s.name,
      startDate: s.start_date, endDate: s.end_date
    }));
    if (state.semesters.length === 0) {
      state.semesters = [{ id: 'default', name: '默认学期' }];
    }

    // Pull courses
    const { data: courses } = await supabase.from('courses').select('*').eq('user_id', uid);
    state.courses = {};
    (courses || []).forEach(c => {
      state.courses[c.id] = {
        id: c.id, name: c.name, semester: c.semester_id,
        color: c.color, examDate: c.exam_date, notes: c.notes
      };
    });

    // Pull topics
    const { data: topics } = await supabase.from('topics').select('*').eq('user_id', uid);
    const { data: tests } = await supabase.from('tests').select('*').eq('user_id', uid);

    state.topics = {};
    (topics || []).forEach(t => {
      state.topics[t.id] = {
        id: t.id, name: t.name, tags: t.tags || [],
        courseId: t.course_id, createdAt: new Date(t.created_at).getTime(),
        tests: (tests || []).filter(te => te.topic_id === t.id).map(te => ({
          id: te.id, type: te.type, score: te.score,
          duration: te.duration, explanation: te.explanation,
          checks: te.checks, subtopics: te.subtopics,
          details: te.details, date: te.date
        }))
      };
    });

    // Pull quizzes
    const { data: quizzes } = await supabase.from('quizzes').select('*').eq('user_id', uid);
    state.quizzes = {};
    (quizzes || []).forEach(q => {
      state.quizzes[q.id] = { id: q.id, name: q.name, questions: q.questions };
    });

    // Pull settings
    const { data: settings } = await supabase.from('user_settings').select('*').eq('user_id', uid).maybeSingle();
    if (settings) {
      state.theme = settings.dark_mode ? 'dark' : 'light';
      state.hasSeenWelcome = settings.has_seen_welcome;
    }

    saveStateLocal();
    showSyncIndicator(false);
    return true;
  } catch(e) {
    console.error('[Cloud] Pull failed:', e);
    showSyncIndicator(false, '加载失败');
    return false;
  }
}

// 防抖推送 — 数据变化后 2 秒自动同步
function cloudSyncDebounced() {
  if (!isOnlineMode || !currentUser) return;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => cloudPushAll(), 2000);
}

// 同步指示器
function showSyncIndicator(show, text) {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  if (show) {
    el.style.display = 'flex';
    el.querySelector('.sync-text').textContent = text || '同步中...';
  } else {
    if (text) {
      el.querySelector('.sync-text').textContent = text;
      setTimeout(() => { el.style.display = 'none'; }, 2000);
    } else {
      el.style.display = 'none';
    }
  }
}

/* ----- 认证 UI ----- */
let authTab = 'login';

function switchAuthTab(tab) {
  authTab = tab;
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('auth-submit').textContent = tab === 'login' ? '登录' : '注册';
  document.getElementById('auth-error').style.display = 'none';
}

function showAuthOverlay() {
  document.getElementById('auth-overlay').style.display = 'flex';
}

function hideAuthOverlay() {
  document.getElementById('auth-overlay').style.display = 'none';
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-submit');

  if (!email || !password) {
    errEl.textContent = '请填写邮箱和密码';
    errEl.style.display = 'block';
    return;
  }
  if (password.length < 6) {
    errEl.textContent = '密码至少 6 位';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = '处理中...';
  errEl.style.display = 'none';

  try {
    if (authTab === 'login') {
      const { data, error } = await signIn(email, password);
      if (error) throw error;
      currentUser = data.user;
    } else {
      const { data, error } = await signUp(email, password);
      if (error) throw error;
      if (!data.session) {
        // 需要确认邮箱
        errEl.textContent = '注册成功！请检查邮箱确认链接，然后回来登录。';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '登录';
        return;
      }
      currentUser = data.user;
    }

    isOnlineMode = true;
    hideAuthOverlay();

    // 拉取云端数据
    const pulled = await cloudPullAll();
    if (!pulled) {
      // 云端没数据，把本地数据推上去
      await cloudPushAll();
    }

    applyTheme();
    navigate('home');
    updateUserInfo();
    toast('☁️ 已连接云端');
  } catch(e) {
    errEl.textContent = e.message || '操作失败';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = authTab === 'login' ? '登录' : '注册';
  }
}

function updateUserInfo() {
  if (currentUser) {
    const settingsNav = document.querySelector('[data-nav="settings"]');
    if (settingsNav) {
      settingsNav.querySelector('.nav-icon').textContent = '👤';
    }
  }
}

function useLocalOnly() {
  isOnlineMode = false;
  hideAuthOverlay();
  loadStateLocal();
  applyTheme();
  navigate('home');
  toast('📱 离线模式（数据仅保存在本地）');
}

  topics: {},       // { id: { id, name, courseId: null, tags: [], createdAt, tests: [] } }
  quizzes: {},      // { id: { id, name, questions, createdAt } }
  courses: {},      // { id: { id, name, semester, color, examDate, createdAt } }
  semesters: [],    // [{ id, name }]
  theme: 'light',

  currentTopicDetail: null,
  currentSemester: null,
  feynmanDraft: null,
  recallDraft: null,
  quizDraft: null,
  overviewFilter: 'all',  // all, course, tag
  overviewSearch: '',
  hasSeenWelcome: false
};

const STORAGE_KEY = 'selftest_v3';

const COURSE_COLORS = ['#6366f1','#f59e0b','#10b981','#ec4899','#06b6d4','#8b5cf6','#ef4444','#14b8a6'];

function loadStateLocal() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const p = JSON.parse(saved);
      state.topics = p.topics || {};
      state.quizzes = p.quizzes || {};
      state.courses = p.courses || {};
      state.semesters = p.semesters || [];
      state.theme = p.theme || 'light';
      state.hasSeenWelcome = p.hasSeenWelcome || false;
      if (state.semesters.length === 0) {
        state.semesters = [{ id: 'default', name: '默认学期' }];
      }
    }
  } catch(e) { console.error('Load failed:', e); }
}

function saveStateLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      topics: state.topics,
      quizzes: state.quizzes,
      courses: state.courses,
      semesters: state.semesters,
      theme: state.theme,
      hasSeenWelcome: state.hasSeenWelcome
    }));
  } catch(e) { console.error('Save failed:', e); }
}

// 兼容旧调用名
function loadState() { loadStateLocal(); }

function saveState() {
  saveStateLocal();
  // 如果在线，防抖推送到云端
  if (isOnlineMode && currentUser) {
    cloudSyncDebounced();
  }
}

function uid() { return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1800);
  setTimeout(() => t.remove(), 2200);
}

function showModal(title, body, actions) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-content">
      <div class="modal-title">${title}</div>
      <div class="modal-body">${body}</div>
      <div class="modal-actions">${actions.map((a,i) =>
        `<button class="btn ${a.cls||'btn-secondary'}" style="flex:1" data-action="${i}">${a.label}</button>`
      ).join('')}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.action);
      overlay.remove();
      if (actions[idx].onClick) actions[idx].onClick();
    };
  });
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeToggle').textContent = state.theme === 'dark' ? '☀️' : '🌙';
}

  state.theme = state.theme === 'dark' ? 'light' : 'dark';

/* ============================================================
   NAVIGATION
   ============================================================ */
function navigate(view) {
  state.currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.nav === view);
  });
  const container = document.getElementById('view-container');
  container.className = '';
  void container.offsetWidth;
  switch(view) {
    case 'home': container.innerHTML = renderHome(); break;
    case 'test': container.innerHTML = renderTestHub(); break;
    case 'feynman':
      if (feynmanTimerInterval) { clearInterval(feynmanTimerInterval); feynmanTimerInterval = null; }
      container.innerHTML = renderFeynman();
      if (state.feynmanDraft?.phase === 'write') startFeynmanTimer();
      break;
    case 'recall': container.innerHTML = renderRecall(); break;
    case 'quiz': container.innerHTML = renderQuiz(); break;
    case 'overview': container.innerHTML = renderOverview(); break;
    case 'schedule': container.innerHTML = renderSchedule(); break;
    case 'settings': container.innerHTML = renderSettings(); break;
    case 'topicDetail':
      container.innerHTML = renderTopicDetail(state.currentTopicDetail);
      break;
    case 'courseDetail':
      container.innerHTML = renderCourseDetail(state.currentCourseDetail);
      break;
  }
  window.scrollTo({top:0, behavior:'instant'});
}

function navigateToTopic(topicId) {
  state.currentTopicDetail = topicId;
  navigate('topicDetail');
}

function navigateToCourse(courseId) {
  state.currentCourseDetail = courseId;
  navigate('courseDetail');
}

/* ============================================================
   DATA HELPERS
   ============================================================ */
function getAllTopics() { return Object.values(state.topics).sort((a,b) => b.createdAt - a.createdAt); }
function getOrCreateTopic(name, courseId) {
  name = name.trim();
  let topic = Object.values(state.topics).find(t => t.name === name);
  if (!topic) {
    topic = { id: uid(), name, courseId: courseId || null, tags: [], createdAt: Date.now(), tests: [] };
    state.topics[topic.id] = topic;
  } else if (courseId && !topic.courseId) {
    topic.courseId = courseId;
  }
  return topic;
}
function getTopicTests(topicId) { return state.topics[topicId]?.tests || []; }
function getTopicMastery(topicId) {
  const tests = getTopicTests(topicId);
  if (!tests.length) return 0;
  const weights = tests.map((_, i) => i + 1);
  const totalW = weights.reduce((a,b) => a+b, 0);
  const weighted = tests.map((t, i) => t.score * weights[i]).reduce((a,b) => a+b, 0);
  return Math.round(weighted / totalW);
}
function getAllTests() {
  return Object.values(state.topics).flatMap(t => t.tests.map(test => ({...test, topicName: t.name, topicId: t.id})));
}
function getAllQuizzes() { return Object.values(state.quizzes).sort((a,b) => b.createdAt - a.createdAt); }
function getCourses(semester) { return Object.values(state.courses).filter(c => c.semester === semester).sort((a,b) => a.createdAt - b.createdAt); }
function getCourseTopics(courseId) { return Object.values(state.topics).filter(t => t.courseId === courseId).sort((a,b) => b.createdAt - a.createdAt); }
function getCourseMastery(courseId) {
  const topics = getCourseTopics(courseId);
  if (!topics.length) return 0;
  const masteries = topics.map(t => getTopicMastery(t.id));
  return Math.round(masteries.reduce((a,b) => a+b, 0) / masteries.length);
}
function getAllTags() {
  const tagSet = new Set();
  Object.values(state.topics).forEach(t => (t.tags || []).forEach(tag => tagSet.add(tag)));
  return Array.from(tagSet).sort();
}

function formatDate(ts) {
  const d = new Date(ts);
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  if (diff < 604800000) return Math.floor(diff/86400000) + '天前';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function formatDateFull(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function scoreColor(score) {
  if (score >= 80) return 'var(--success)';
  if (score >= 50) return 'var(--accent)';
  return 'var(--danger)';
}
function masteryEmoji(score) {
  if (score >= 85) return '🌟';
  if (score >= 65) return '✅';
  if (score >= 40) return '🤔';
  return '❌';
}
function masteryLabel(score) {
  if (score >= 85) return '真正掌握了';
  if (score >= 65) return '基本掌握';
  if (score >= 40) return '需要巩固';
  return '还没学会';
}
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function typeName(type) { return { feynman: '费曼', recall: '回忆', quiz: '闯关' }[type] || type; }
function getExamStatus(examDate) {
  if (!examDate) return null;
  const days = Math.ceil((examDate - Date.now()) / 86400000);
  if (days < 0) return { label: '已结束', cls: '', days };
  if (days === 0) return { label: '今天考试', cls: 'soon', days };
  if (days <= 7) return { label: `${days}天后`, cls: 'soon', days };
  if (days <= 30) return { label: `${days}天后`, cls: 'far', days };
  return { label: `${days}天后`, cls: 'far', days };
}

/* ============================================================
   HOME VIEW
   ============================================================ */
function renderHome() {
  const topics = getAllTopics();
  const allTests = getAllTests();
  const totalTests = allTests.length;
  const masteredCount = topics.filter(t => getTopicMastery(t.id) >= 65).length;
  const courseCount = Object.keys(state.courses).length;

  // Weekly stats
  const now = new Date();
  const weekAgo = now.getTime() - 7 * 86400000;
  const weekTests = allTests.filter(t => t.date >= weekAgo);
  const weekAvg = weekTests.length > 0 ? Math.round(weekTests.reduce((s,t) => s+t.score, 0) / weekTests.length) : 0;

  // Weekly bars
  const dayLabels = ['日','一','二','三','四','五','六'];
  const today = now.getDay();
  const weekBars = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 86400000);
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const dayEnd = dayStart + 86400000;
    const count = allTests.filter(t => t.date >= dayStart && t.date < dayEnd).length;
    const isToday = i === 0;
    const labelIdx = d.getDay();
    weekBars.push({ count, isToday, label: dayLabels[labelIdx] });
  }
  const maxCount = Math.max(...weekBars.map(b => b.count), 1);

  const weekBarsHtml = weekBars.map(b => `
    <div class="weekly-bar ${b.count > 0 ? 'has-data' : ''} ${b.isToday ? 'today' : ''}"
         style="height:${Math.max(3, (b.count / maxCount) * 24)}px"></div>
  `).join('');
  const weekLabelsHtml = weekBars.map(b => `<div class="weekly-bar-label">${b.label}</div>`).join('');

  // Review reminders (forgetting curve)
  const reviewTopics = topics.filter(t => {
    const tests = getTopicTests(t.id);
    if (!tests.length) return false;
    const lastTest = tests[tests.length - 1];
    const daysSince = (Date.now() - lastTest.date) / 86400000;
    if (lastTest.score < 65 && daysSince >= 1) return true;
    if (lastTest.score < 85 && daysSince >= 3) return true;
    if (daysSince >= 7) return true;
    return false;
  }).slice(0, 3);

  const welcomeHtml = (!state.hasSeenWelcome && totalTests === 0) ? `
    <div class="welcome-card stagger-1">
      <div class="wc-close" onclick="dismissWelcome()">✕</div>
      <h3>👋 欢迎来到「学会了吗？」</h3>
      <p>别自我感觉良好，也别怕暴露无知。这里有三种诚实的检测方式：</p>
      <div class="wc-steps">
        <div class="wc-step"><span class="wc-step-num">1</span><span><strong>费曼讲解法</strong> — 用大白话讲清楚一个概念，讲不清就是没懂</span></div>
        <div class="wc-step"><span class="wc-step-num">2</span><span><strong>主动回忆</strong> — 不看资料默写，诚实面对自己的记忆盲区</span></div>
        <div class="wc-step"><span class="wc-step-num">3</span><span><strong>自测闯关</strong> — 自己出题考自己，逐题对照打分</span></div>
      </div>
      <div style="margin-top:10px;font-size:13px;color:var(--primary)">
        💡 新增：去「课程」页面创建你的大学课程表，把自测主题关联到课程！
      </div>
    </div>
  ` : '';

  let recentHtml = '';
  if (allTests.length > 0) {
    const recent = allTests.sort((a,b) => b.date - a.date).slice(0, 5);
    recentHtml = recent.map((t,i) => `
      <div class="topic-item stagger-${Math.min(i+2, 6)}" onclick="navigateToTopic('${t.topicId}')">
        <div class="topic-icon" style="background:${t.type === 'feynman' ? 'var(--accent-light)' : t.type === 'recall' ? 'var(--primary-light)' : 'var(--success-light)'}">
          ${t.type === 'feynman' ? '💡' : t.type === 'recall' ? '🧠' : '🎯'}
        </div>
        <div class="topic-info">
          <div class="topic-name">${esc(t.topicName)}</div>
          <div class="topic-meta"><span class="tag tag-${t.type}">${typeName(t.type)}</span> ${formatDate(t.date)}</div>
        </div>
        <div class="quick-btn" onclick="event.stopPropagation();quickRetest('${t.topicId}','${t.type}')" title="快速重测">🔄</div>
        <div style="text-align:right;margin-left:4px">
          <div style="font-size:18px;font-weight:800;color:${scoreColor(t.score)}">${t.score}</div>
          <div class="text-xs text-faint">分</div>
        </div>
      </div>
    `).join('');
  } else {
    recentHtml = `
      <div class="empty-state">
        <div class="emoji">🌱</div>
        <div class="text">还没有测试记录</div>
        <div class="sub">选一个模式开始第一次诚实的自检吧</div>
      </div>`;
  }

  return `
    ${welcomeHtml}
    <div class="hero-card stagger-1">
      <span class="hero-emoji">🔍</span>
      <h2>嘿，真的学会了吗？</h2>
      <p>别自我感觉良好，用三种方法诚实地检验一下</p>
    </div>

    ${weekTests.length > 0 ? `
      <div class="weekly-card stagger-2">
        <div class="weekly-ring">
          <svg width="56" height="56" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="22" fill="none" stroke="var(--border)" stroke-width="6"/>
            <circle cx="28" cy="28" r="22" fill="none" stroke="var(--primary)" stroke-width="6"
                    stroke-dasharray="${2*Math.PI*22}" stroke-dashoffset="${2*Math.PI*22*(1-weekAvg/100)}"
                    stroke-linecap="round" style="transition:stroke-dashoffset 1s var(--ease-out)"/>
          </svg>
          <div class="ring-label" style="color:${scoreColor(weekAvg)}">${weekAvg}</div>
        </div>
        <div class="weekly-info">
          <div class="weekly-title">本周概况</div>
          <div class="weekly-detail">${weekTests.length} 次检测 · 平均 ${weekAvg} 分</div>
          <div class="weekly-bars">${weekBarsHtml}</div>
          <div class="weekly-bar-labels">${weekLabelsHtml}</div>
        </div>
      </div>
    ` : ''}

    <div class="stats-row stagger-2">
      <div class="stat-card" style="--stat-color:var(--primary)">
        <div class="stat-num" style="color:var(--primary)">${topics.length}</div>
        <div class="stat-label">学习主题</div>
      </div>
      <div class="stat-card" style="--stat-color:var(--accent)">
        <div class="stat-num" style="color:var(--accent)">${totalTests}</div>
        <div class="stat-label">检测次数</div>
      </div>
      <div class="stat-card" style="--stat-color:var(--success)">
        <div class="stat-num" style="color:var(--success)">${masteredCount}</div>
        <div class="stat-label">已掌握</div>
      </div>
    </div>

    ${reviewTopics.length > 0 ? `
      <div class="section-title">🔔 该复习了</div>
      <div class="card stagger-3" style="border-left:4px solid var(--accent)">
        ${reviewTopics.map(t => {
          const tests = getTopicTests(t.id);
          const last = tests[tests.length-1];
          const mastery = getTopicMastery(t.id);
          return `
            <div class="topic-item" style="margin-bottom:8px" onclick="navigateToTopic('${t.id}')">
              <div class="topic-icon" style="background:${scoreColor(mastery)==='var(--success)'?'var(--success-light)':scoreColor(mastery)==='var(--accent)'?'var(--accent-light)':'var(--danger-light)'}">${masteryEmoji(mastery)}</div>
              <div class="topic-info">
                <div class="topic-name">${esc(t.name)}</div>
                <div class="topic-meta">上次 ${last.score} 分 · ${formatDate(last.date)}</div>
              </div>
              <div class="quick-btn" onclick="event.stopPropagation();quickRetest('${t.id}','${last.type}')" title="快速重测">🔄</div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}

    <div class="section-title">选择检测方式</div>
    <div class="mode-grid">
      <div class="mode-card stagger-3" onclick="navigate('feynman')" style="--mode-accent:var(--accent)">
        <span class="mode-tag" style="background:var(--accent-light);color:var(--accent)">推荐</span>
        <span class="mode-icon">💡</span>
        <div class="mode-name">费曼讲解法</div>
        <div class="mode-desc">用大白话讲清楚，讲不清就是没懂</div>
      </div>
      <div class="mode-card stagger-3" onclick="navigate('recall')" style="--mode-accent:var(--primary)">
        <span class="mode-tag" style="background:var(--primary-light);color:var(--primary)">高效</span>
        <span class="mode-icon">🧠</span>
        <div class="mode-name">主动回忆</div>
        <div class="mode-desc">不看资料默写，诚实面对自己</div>
      </div>
      <div class="mode-card stagger-4" onclick="navigate('quiz')" style="--mode-accent:var(--success)">
        <span class="mode-icon">🎯</span>
        <div class="mode-name">自测闯关</div>
        <div class="mode-desc">自己出题考自己，逐题判分</div>
      </div>
      <div class="mode-card stagger-4" onclick="navigate('schedule')" style="--mode-accent:var(--info)">
        <span class="mode-icon">📅</span>
        <div class="mode-name">课程表</div>
        <div class="mode-desc">按课程管理自测主题</div>
      </div>
    </div>

    <div class="section-title">最近检测</div>
    <div>${recentHtml}</div>
  `;
}

function dismissWelcome() {
  state.hasSeenWelcome = true;
  saveState();
  navigate('home');
}

function quickRetest(topicId, type) {
  const topic = state.topics[topicId];
  if (!topic) return;
  if (type === 'feynman') startFeynman(topic.name);
  else if (type === 'recall') {
    const recallTests = topic.tests.filter(t => t.type === 'recall');
    if (recallTests.length > 0 && recallTests[recallTests.length-1].subtopics) {
      const subs = recallTests[recallTests.length-1].subtopics.map(s => s.name);
      startRecall(topic.name, subs);
    } else {
      startRecall(topic.name, ['核心概念','关键要点','应用场景']);
    }
  } else if (type === 'quiz') {
    const quiz = Object.values(state.quizzes).find(q => q.name === topic.name);
    if (quiz) startQuizTake(quiz.id);
    else navigate('quiz');
  }
}

];

const feynmanChecks = [
  { text: '我没有使用任何没解释的专业术语', neg: '用了一些没解释的术语' },
  { text: '我在讲解中没有卡住或含糊其辞', neg: '有几处含糊' },
  { text: '我举了具体的例子来说明', neg: '没举例子' },
  { text: '我能解释"为什么是这样"，而不只是"是什么"', neg: '只讲了是什么' },
  { text: '我能用类比或比喻帮助理解', neg: '没有用类比' },
  { text: '我知道这个知识的适用边界（什么时候不能用）', neg: '没提适用边界' },
  { text: '一个完全不懂的人看我的讲解能大致明白', neg: '外人可能看不懂' },
];

function renderFeynman() {
  if (state.feynmanDraft?.phase === 'write') return renderFeynmanWrite();
  if (state.feynmanDraft?.phase === 'check') return renderFeynmanCheck();
  if (state.feynmanDraft?.phase === 'result') return renderFeynmanResult();

  const topics = getAllTopics();
  const topicChips = topics.slice(0, 6).map(t =>
    `<span class="chip" style="cursor:pointer" onclick="startFeynman('${esc(t.name)}')">${esc(t.name)}</span>`
  ).join('');

  return `
    <div class="card stagger-1">
      <div style="font-size:36px;margin-bottom:8px">💡</div>
      <h2 style="font-size:20px;font-weight:800;margin-bottom:6px">费曼讲解法</h2>
      <p class="text-muted text-sm" style="margin-bottom:16px">
        费曼说：如果你不能用简单的话向别人讲清楚一个概念，说明你并没有真正理解它。<br><br>
        规则很简单：输入你要检验的主题，然后<strong>假装在向一个完全不懂的人讲解</strong>。写完之后，诚实地回答几个问题。
      </p>
      <div class="form-group">
        <label class="form-label">你要检验什么？</label>
        <input class="form-input" id="feynman-topic" placeholder="如：React Hooks、边际效用、线粒体..."

    </div>
    <div class="card stagger-2">
      <div class="section-title" style="margin-top:0">📋 费曼检测流程</div>
      <div style="font-size:13px;color:var(--text-2);line-height:1.8">
        <div><strong>1.</strong> 输入主题</div>
        <div><strong>2.</strong> 不看任何资料，用自己的话把概念讲清楚</div>
        <div><strong>3.</strong> 完成后，回答 7 个自检问题</div>

}

function startFeynmanFromInput() {
  const topic = document.getElementById('feynman-topic')?.value.trim();
  if (!topic) { toast('请先输入要检验的主题'); return; }

}

function startFeynman(topicName) {
  state.feynmanDraft = {
    topic: topicName, explanation: '',
    checks: [false,false,false,false,false,false,false],
    phase: 'write', startTime: Date.now(),
    promptIdx: Math.floor(Math.random() * feynmanPrompts.length)
  };

}

function renderFeynmanWrite() {
  const d = state.feynmanDraft;
  const elapsed = d.startTime ? Math.floor((Date.now() - d.startTime) / 1000) : 0;
  return `
    <div class="card stagger-1">
      <div class="flex-between mb-16">
        <div>

        </div>

        </div>
      </div>
      <div class="writing-prompt" id="writing-prompt">
        <span class="prompt-icon">${feynmanPrompts[d.promptIdx].split(' ')[0]}</span>

      <button class="btn btn-ghost mt-8" onclick="cancelFeynman()">放弃</button>

}

function updateFeynmanText() {
  const el = document.getElementById('feynman-text');
  state.feynmanDraft.explanation = el.value;
  const wc = document.getElementById('feynman-wc');
  if (wc) wc.textContent = el.value.length;

let feynmanTimerInterval = null;
function startFeynmanTimer() {
  if (feynmanTimerInterval) clearInterval(feynmanTimerInterval);
  feynmanTimerInterval = setInterval(() => {
    if (state.currentView !== 'feynman' || !state.feynmanDraft || state.feynmanDraft.phase !== 'write') {
      clearInterval(feynmanTimerInterval);
      feynmanTimerInterval = null;
      return;
    }
    const elapsed = Math.floor((Date.now() - state.feynmanDraft.startTime) / 1000);
    const el = document.getElementById('feynman-time');
    if (el) el.textContent = `${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,'0')}`;
  }, 1000);
}

function submitFeynmanWrite() {
  const text = document.getElementById('feynman-text').value.trim();
  if (text.length < 30) { toast('讲解太短了，至少写 30 个字吧'); return; }
  state.feynmanDraft.explanation = text;
  state.feynmanDraft.phase = 'check';
  navigate('feynman');
}

function renderFeynmanCheck() {
  const d = state.feynmanDraft;
  const checksHtml = feynmanChecks.map((c, i) => `
    <div class="check-item ${d.checks[i] ? 'checked' : ''}" onclick="toggleFeynmanCheck(${i})">
      <div class="check-circle">${d.checks[i] ? '✓' : ''}</div>
      <div class="check-text">${c.text}</div>
    </div>
  `).join('');
  return `
    <div class="card stagger-1">
      <div style="margin-bottom:16px">
        <div class="text-xs text-faint">正在检验</div>
        <div style="font-size:18px;font-weight:800">${esc(d.topic)}</div>
      </div>
      <div class="form-group">
        <label class="form-label">📖 你刚才写的讲解</label>
        <div style="background:var(--card-2);border-radius:var(--radius-sm);padding:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;max-height:200px;overflow-y:auto;border:1px solid var(--border)">${esc(d.explanation)}</div>
      </div>
      <div class="form-label">现在，诚实地问自己（共 7 项）：</div>
      <div class="feynman-checklist">${checksHtml}</div>
      <button class="btn btn-primary" onclick="submitFeynmanCheck()">查看结果</button>
      <button class="btn btn-ghost mt-8" onclick="state.feynmanDraft.phase='write';navigate('feynman')">返回修改讲解</button>
    </div>
  `;
}

function toggleFeynmanCheck(idx) {
  state.feynmanDraft.checks[idx] = !state.feynmanDraft.checks[idx];
  navigate('feynman');
}

function submitFeynmanCheck() {
  const d = state.feynmanDraft;
  const passed = d.checks.filter(c => c).length;
  let score = Math.round((passed / 7) * 75);
  const len = d.explanation.length;
  if (len > 200) score += 25;
  else if (len > 100) score += 18;
  else if (len > 50) score += 8;
  score = Math.min(100, score);
  d.score = score;
  d.phase = 'result';
  const topic = getOrCreateTopic(d.topic);
  topic.tests.push({
    id: uid(), type: 'feynman', date: Date.now(), score,
    explanation: d.explanation, checks: [...d.checks],
    duration: Math.round((Date.now() - d.startTime) / 1000)
  });
  saveState();
  if (score >= 80) celebrate();
  navigate('feynman');
}

      <div class="result-stat"><div class="num" style="color:var(--primary)">${d.explanation.length}</div><div class="label">字数</div></div>
      <div class="result-stat"><div class="num" style="color:var(--accent)">${Math.round(d.duration/60)}:${String(d.duration%60).padStart(2,'0')}</div><div class="label">用时</div></div>
    </div>

      <div class="section-title" style="margin-top:0">📖 你的讲解</div>
      <div style="font-size:14px;line-height:1.8;white-space:pre-wrap;color:var(--text-2)">${esc(d.explanation)}</div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">🔍 自检详情</div>
      ${feynmanChecks.map((c, i) => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:16px">${d.checks[i] ? '✅' : '❌'}</span>
          <span style="font-size:13px;flex:1">${d.checks[i] ? c.text : c.neg}</span>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">💡 下一步建议</div>
      <div style="font-size:14px;line-height:1.8;color:var(--text-2)">${getNextStep(score, 'feynman')}</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="navigate('home')">回到首页</button>

  `;

function restartFeynman() {
  const topic = state.feynmanDraft.topic;
  state.feynmanDraft = null;
  startFeynman(topic);
}
function cancelFeynman() { state.feynmanDraft = null; navigate('home'); }

/* ============================================================
   RECALL TEST
   ============================================================ */
function renderRecall() {
  if (state.recallDraft) return renderRecallStep();
  const topics = getAllTopics();
  const topicChips = topics.slice(0, 6).map(t =>
    `<span class="chip" style="cursor:pointer" onclick="startRecall('${esc(t.name)}')">${esc(t.name)}</span>`
  ).join('');
  return `
    <div class="card stagger-1">
      <div style="font-size:36px;margin-bottom:8px">🧠</div>
      <h2 style="font-size:20px;font-weight:800;margin-bottom:6px">主动回忆</h2>
      <p class="text-muted text-sm" style="margin-bottom:16px">
        认知科学证明：主动回忆（Active Recall）是最有效的学习方法之一。<br><br>
        你要做的：<br>
        <strong>1.</strong> 输入主题和几个子知识点<br>
        <strong>2.</strong> 不看任何资料，逐个默写你记得的内容<br>
        <strong>3.</strong> 写完后对照资料，诚实地给自己打分
      </p>
      <div class="form-group">
        <label class="form-label">检验主题</label>
        <input class="form-input" id="recall-topic" placeholder="如：JavaScript 闭包、法国大革命..."
               onkeydown="if(event.key==='Enter')document.getElementById('recall-subtopics').focus()">
        ${topicChips ? `<div class="chip-list">${topicChips}</div>` : ''}
      </div>
      <div class="form-group">
        <label class="form-label">子知识点（每行一个，至少 2 个）</label>
        <textarea class="form-textarea" id="recall-subtopics" placeholder="比如：&#10;什么是闭包&#10;闭包的使用场景&#10;闭包的内存问题" style="min-height:100px"></textarea>
        <div class="form-hint">把大的主题拆成几个小的点来检验更有效</div>
      </div>
      <button class="btn btn-primary" onclick="startRecallFromInput()">开始回忆</button>
    </div>
  `;
}

function startRecallFromInput() {
  const topic = document.getElementById('recall-topic').value.trim();
  const raw = document.getElementById('recall-subtopics').value.trim();
  if (!topic) { toast('请输入检验主题'); return; }
  const subs = raw.split('\n').map(s => s.trim()).filter(s => s);
  if (subs.length < 2) { toast('至少输入 2 个子知识点'); return; }
  startRecall(topic, subs);
}

function startRecall(topicName, subtopics) {
  state.recallDraft = {
    topic: topicName,
    subtopics: subtopics.map(s => ({ name: s, recall: '', grade: null, uncertain: false })),
    currentIdx: 0, phase: 'recall', startTime: Date.now()
  };
  navigate('recall');
}

function renderRecallStep() {
  const d = state.recallDraft;
  const idx = d.currentIdx;
  const sub = d.subtopics[idx];
  const total = d.subtopics.length;

  if (d.phase === 'recall') {
    return `
      <div class="card stagger-1">
        <div class="flex-between mb-16">
          <div>
            <div class="text-xs text-faint">正在检验</div>
            <div style="font-size:16px;font-weight:800">${esc(d.topic)}</div>
          </div>
          <div class="text-sm text-muted">${idx+1} / ${total}</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${(idx/total)*100}%"></div></div>
        <div class="recall-step-indicator">
          ${d.subtopics.map((s, i) => `
            <div class="step-dot ${i === idx ? 'active' : ''} ${i < idx ? (s.uncertain ? 'uncertain' : 'done') : ''}"></div>
          `).join('')}
        </div>
        <div class="recall-prompt-box">
          <div class="prompt-label">不看资料，凭记忆写出你关于这个点所知道的一切：</div>
          <div class="prompt-text">${esc(sub.name)}</div>
        </div>
        <div class="form-group">
          <textarea class="form-textarea" id="recall-text-${idx}" placeholder="开始写你记得的内容..."
                    style="min-height:180px" oninput="updateRecallText(${idx})">${esc(sub.recall)}</textarea>
          <div class="word-count-bar">
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
              <input type="checkbox" id="recall-uncertain-${idx}" style="width:auto;cursor:pointer"
                     ${sub.uncertain ? 'checked' : ''} onchange="toggleUncertain(${idx})">
              <span class="text-faint">🤔 不太确定，待会重点对照</span>
            </label>
            <span><span class="wc-num" id="recall-wc-${idx}">${sub.recall.length}</span> 字</span>
          </div>
        </div>
        <button class="btn btn-primary" onclick="nextRecallStep()">写完了，下一步</button>
        ${idx > 0 ? `<button class="btn btn-ghost mt-8" onclick="prevRecallStep()">上一个</button>` : ''}
      </div>
    `;
  }

  if (d.phase === 'grade') {
    return `
      <div class="card stagger-1">
        <div class="flex-between mb-16">
          <div>
            <div class="text-xs text-faint">对照评估</div>
            <div style="font-size:16px;font-weight:800">${esc(d.topic)}</div>
          </div>
          <div class="text-sm text-muted">${idx+1} / ${total}</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${((idx+1)/total)*100}%"></div></div>
        <div class="recall-display-box">
          <div class="box-label">你回忆的「${esc(sub.name)}」${sub.uncertain ? '<span style="color:var(--accent)"> · 🤔 标记了不确定</span>' : ''}：</div>
          <div class="box-content">${sub.recall ? esc(sub.recall) : '<span class="text-faint">（你跳过了这个）</span>'}</div>
        </div>
        <p class="text-sm text-muted mb-8">现在对照你的笔记/教材/资料，诚实评估你刚才写的内容：</p>
        <div class="grade-buttons">
          <div class="grade-btn grade-good" onclick="gradeRecall(${idx}, 'good')">
            <span class="grade-emoji">✅</span><span>确实掌握了</span>
          </div>
          <div class="grade-btn grade-mid" onclick="gradeRecall(${idx}, 'mid')">
            <span class="grade-emoji">🤔</span><span>有点模糊</span>
          </div>
          <div class="grade-btn grade-bad" onclick="gradeRecall(${idx}, 'bad')">
            <span class="grade-emoji">❌</span><span>完全不会</span>
          </div>
        </div>
      </div>
    `;
  }

  if (d.phase === 'result') return renderRecallResult();
}

function updateRecallText(idx) {
  const el = document.getElementById(`recall-text-${idx}`);
  if (el) {
    state.recallDraft.subtopics[idx].recall = el.value;
    const wc = document.getElementById(`recall-wc-${idx}`);
    if (wc) wc.textContent = el.value.length;
  }
}

function toggleUncertain(idx) {
  state.recallDraft.subtopics[idx].uncertain = !state.recallDraft.subtopics[idx].uncertain;
}

function nextRecallStep() {
  const d = state.recallDraft;
  updateRecallText(d.currentIdx);
  const text = d.subtopics[d.currentIdx].recall.trim();
  if (text.length < 10) { toast('再写一点吧，至少 10 个字'); return; }
  if (d.currentIdx < d.subtopics.length - 1) {
    d.currentIdx++;
    navigate('recall');
  } else {
    d.currentIdx = 0;
    d.phase = 'grade';
    navigate('recall');
  }
}

function prevRecallStep() {
  const d = state.recallDraft;
  if (d.currentIdx > 0) { d.currentIdx--; navigate('recall'); }
}

function gradeRecall(idx, grade) {
  const d = state.recallDraft;
  d.subtopics[idx].grade = grade;
  if (d.currentIdx < d.subtopics.length - 1) {
    d.currentIdx++;
    navigate('recall');
  } else {
    const grades = d.subtopics.map(s => s.grade);
    const good = grades.filter(g => g === 'good').length;
    const mid = grades.filter(g => g === 'mid').length;
    const total = grades.length;
    const score = Math.round((good * 100 + mid * 50 + 0) / total);
    d.score = score;
    const topic = getOrCreateTopic(d.topic);
    topic.tests.push({
      id: uid(), type: 'recall', date: Date.now(), score,
      subtopics: d.subtopics.map(s => ({ name: s.name, grade: s.grade, uncertain: s.uncertain, recallLength: s.recall.length })),
      duration: Math.round((Date.now() - d.startTime) / 1000)
    });
    saveState();
    if (score >= 80) celebrate();
    d.phase = 'result';
    navigate('recall');
  }
}

function renderRecallResult() {
  const d = state.recallDraft;
  const score = d.score;
  const color = scoreColor(score);
  const ringC = 2 * Math.PI * 42;
  const ringO = ringC * (1 - score / 100);
  const good = d.subtopics.filter(s => s.grade === 'good').length;
  const mid = d.subtopics.filter(s => s.grade === 'mid').length;
  const bad = d.subtopics.filter(s => s.grade === 'bad').length;
  const uncertain = d.subtopics.filter(s => s.uncertain).length;
  return `
    <div class="result-hero scale-in" style="background:${color}">
      <div class="result-ring">
        <svg width="110" height="110" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="8"/>
          <circle cx="50" cy="50" r="42" fill="none" stroke="#fff" stroke-width="8"
                  stroke-dasharray="${ringC}" stroke-dashoffset="${ringO}"
                  stroke-linecap="round" style="transition:stroke-dashoffset 1.2s var(--ease-out)"/>
        </svg>
        <div class="ring-num" style="color:#fff">${score}</div>
      </div>
      <h2 style="color:#fff">${masteryEmoji(score)} ${masteryLabel(score)}</h2>
      <p style="color:rgba(255,255,255,.85)">主动回忆 · ${esc(d.topic)}</p>
    </div>
    <div class="result-stats">
      <div class="result-stat"><div class="num" style="color:var(--success)">${good}</div><div class="label">确实掌握</div></div>
      <div class="result-stat"><div class="num" style="color:var(--accent)">${mid}</div><div class="label">有点模糊</div></div>
      <div class="result-stat"><div class="num" style="color:var(--danger)">${bad}</div><div class="label">完全不会</div></div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">📋 知识点详情</div>
      ${d.subtopics.map(s => `
        <div style="display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:16px;margin-top:1px">${s.grade === 'good' ? '✅' : s.grade === 'mid' ? '🤔' : '❌'}</span>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:600">${esc(s.name)} ${s.uncertain ? '<span class="text-xs" style="color:var(--accent)">🤔 不确定</span>' : ''}</div>
            <div class="text-xs text-faint mt-8">${s.recall ? `写了 ${s.recall.length} 字` : '跳过了'}</div>
          </div>
        </div>
      `).join('')}
    </div>
    ${uncertain > 0 ? `
      <div class="card" style="border-left:4px solid var(--accent)">
        <div style="font-size:13px;color:var(--text-2);line-height:1.7">
          ⚠️ 你标记了 <strong>${uncertain}</strong> 个不确定的知识点，这些是你最该优先复习的地方。
        </div>
      </div>
    ` : ''}
    <div class="card">
      <div class="section-title" style="margin-top:0">💡 下一步建议</div>
      <div style="font-size:14px;line-height:1.8;color:var(--text-2)">${getNextStep(score, 'recall')}</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="state.recallDraft=null;navigate('home')">回到首页</button>
      <button class="btn btn-primary" style="flex:1" onclick="restartRecall()">再测一次</button>
    </div>
  `;
}

function restartRecall() {
  const topic = state.recallDraft.topic;
  const subs = state.recallDraft.subtopics.map(s => s.name);
  state.recallDraft = null;
  startRecall(topic, subs);
}

/* ============================================================
   QUIZ MODE
   ============================================================ */
function renderQuiz() {
  if (state.quizDraft?.phase === 'take') return renderQuizTake();
  if (state.quizDraft?.phase === 'result') return renderQuizResult();
  const quizzes = getAllQuizzes();
  return `
    <div class="card stagger-1">
      <div style="font-size:36px;margin-bottom:8px">🎯</div>
      <h2 style="font-size:20px;font-weight:800;margin-bottom:6px">自测闯关</h2>
      <p class="text-muted text-sm" style="margin-bottom:16px">

        好的出题本身就是一种学习——你得真正理解了，才能出好题。
      </p>
      <button class="btn btn-primary" onclick="showQuizCreator()">创建新题库</button>
    </div>
    ${quizzes.length > 0 ? `
      <div class="section-title">已有题库</div>
      ${quizzes.map((q,i) => `
        <div class="card clickable stagger-${Math.min(i+2,6)}" onclick="startQuizTake('${q.id}')">

let quizCreatorQuestions = [];

function showQuizCreator() {
  quizCreatorQuestions = [{ q: '', a: '' }];
  navigate('quiz');
  document.getElementById('view-container').innerHTML = renderQuizCreator();
}

function renderQuizCreator() {
  return `
    <div class="card stagger-1">
      <div class="flex-between mb-16">
        <h2 style="font-size:18px;font-weight:800">创建题库</h2>
        <button class="btn btn-ghost btn-sm" onclick="navigate('quiz')">取消</button>
      </div>
      <div class="form-group">
        <label class="form-label">题库名称</label>
        <input class="form-input" id="quiz-name" placeholder="如：JS 基础概念、宏观经济学第一章">
      </div>
      <div class="section-title" style="margin-top:0">题目（至少 2 题）</div>
      <div id="quiz-questions">
        ${quizCreatorQuestions.map((q, i) => renderQuizQuestionRow(i, q)).join('')}
      </div>
      <button class="btn btn-secondary mt-8" onclick="addQuizQuestion()">+ 添加一题</button>
      <hr class="divider">
      <button class="btn btn-primary" onclick="saveQuiz()">保存并开始闯关</button>
    </div>
  `;
}

function renderQuizQuestionRow(idx, q) {
  return `
    <div class="card" style="background:var(--card-2);margin-bottom:10px" id="quiz-q-${idx}">
      <div class="flex-between mb-8">
        <span class="text-sm font-bold">第 ${idx+1} 题</span>
        ${idx > 1 ? `<button class="btn btn-ghost btn-sm" onclick="removeQuizQuestion(${idx})">✕</button>` : ''}
      </div>
      <div class="form-group">
        <label class="form-label">问题</label>
        <input class="form-input" placeholder="输入问题..."
               value="${esc(q.q)}" oninput="quizCreatorQuestions[${idx}].q=this.value">
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">参考答案</label>
        <textarea class="form-textarea" placeholder="输入参考答案..."
                  style="min-height:70px" oninput="quizCreatorQuestions[${idx}].a=this.value">${esc(q.a)}</textarea>
      </div>
    </div>
  `;
}

function addQuizQuestion() {
  quizCreatorQuestions.push({ q: '', a: '' });
  document.getElementById('quiz-questions').insertAdjacentHTML('beforeend',
    renderQuizQuestionRow(quizCreatorQuestions.length - 1, { q: '', a: '' }));
}

function removeQuizQuestion(idx) {
  if (quizCreatorQuestions.length <= 2) { toast('至少保留 2 题'); return; }
  quizCreatorQuestions.splice(idx, 1);
  document.getElementById('view-container').innerHTML = renderQuizCreator();
}

function saveQuiz() {
  const name = document.getElementById('quiz-name').value.trim();
  if (!name) { toast('请输入题库名称'); return; }
  const valid = quizCreatorQuestions.filter(q => q.q.trim() && q.a.trim());
  if (valid.length < 2) { toast('至少完成 2 道题（含问题和答案）'); return; }
  const quiz = {
    id: uid(), name,
    questions: valid.map(q => ({ id: uid(), q: q.q.trim(), a: q.a.trim() })),
    createdAt: Date.now()
  };
  state.quizzes[quiz.id] = quiz;
  saveState();
  quizCreatorQuestions = [];
  toast('题库已保存！');
  startQuizTake(quiz.id);
}

function deleteQuiz(quizId) {
  showModal('删除题库', '确定删除这个题库吗？此操作不可撤销。', [
    { label: '取消', cls: 'btn-secondary' },
    { label: '删除', cls: 'btn-danger', onClick: () => {
      delete state.quizzes[quizId];
      saveState();
      navigate('quiz');
      toast('题库已删除');
    }}
  ]);
}

function startQuizTake(quizId) {
  const quiz = state.quizzes[quizId];
  if (!quiz) return;
  const shuffled = [...quiz.questions].sort(() => Math.random() - 0.5);
  state.quizDraft = {
    quizId, quizName: quiz.name,
    questions: shuffled.map(q => ({ ...q, userAnswer: '', grade: null, revealed: false })),
    currentIdx: 0, phase: 'take', startTime: Date.now()
  };
  navigate('quiz');
}

function renderQuizTake() {
  const d = state.quizDraft;
  const idx = d.currentIdx;
  const q = d.questions[idx];
  const total = d.questions.length;
  return `
    <div class="card stagger-1">
      <div class="flex-between mb-16">
        <div>
          <div class="text-xs text-faint">${esc(d.quizName)}</div>
          <div style="font-size:16px;font-weight:800">第 ${idx+1} 题 / 共 ${total} 题</div>
        </div>
        <div class="text-sm text-muted">${idx+1}/${total}</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${(idx/total)*100}%"></div></div>

      <div class="form-group">
        <label class="form-label">你的回答</label>
        <textarea class="form-textarea" id="quiz-answer" placeholder="写出你的答案..." style="min-height:120px"

        <div class="word-count-bar">

          ${esc(q.a)}

        <p class="text-sm text-muted mb-8">对照参考答案，诚实地给自己打分：</p>
        <div class="grade-buttons">
          <div class="grade-btn grade-good" onclick="gradeQuiz('good')">

          <div class="grade-btn grade-bad" onclick="gradeQuiz('bad')">
            <span class="grade-emoji">❌</span><span>答错了</span>

        </div>
      `}

function revealQuizAnswer() {
  const d = state.quizDraft;
  d.questions[d.currentIdx].userAnswer = document.getElementById('quiz-answer').value;
  d.questions[d.currentIdx].revealed = true;
  navigate('quiz');
}

  const d = state.quizDraft;
  d.questions[d.currentIdx].grade = grade;
  if (d.currentIdx < d.questions.length - 1) {
    d.currentIdx++;
    navigate('quiz');

    const grades = d.questions.map(q => q.grade);
    const good = grades.filter(g => g === 'good').length;
    const mid = grades.filter(g => g === 'mid').length;
    const total = grades.length;
    const score = Math.round((good * 100 + mid * 50) / total);
    d.score = score;
    const topic = getOrCreateTopic(d.quizName);

      id: uid(), type: 'quiz', date: Date.now(), score,
      details: d.questions.map(q => ({ q: q.q, a: q.a, grade: q.grade })),
      duration: Math.round((Date.now() - d.startTime) / 1000)

    d.phase = 'result';
    navigate('quiz');
  }
}

function restartQuiz() {
  const quizId = state.quizDraft.quizId;
  state.quizDraft = null;
  startQuizTake(quizId);
}

/* ============================================================
   COURSE SCHEDULE (课程表)
   ============================================================ */
function renderSchedule() {
  const semesters = state.semesters;
  if (state.currentSemester === null && semesters.length > 0) {
    state.currentSemester = semesters[0].id;
  }
  const activeSemester = state.currentSemester || (semesters[0]?.id) || 'default';
  state.currentSemester = activeSemester;
  const courses = getCourses(activeSemester);

  const semesterTabsHtml = semesters.map(s => `
    <div class="semester-tab ${s.id === activeSemester ? 'active' : ''}" onclick="switchSemester('${s.id}')">${esc(s.name)}</div>
  `).join('') + `<div class="semester-tab" onclick="showAddSemester()" style="color:var(--primary)">+ 学期</div>`;

  let coursesHtml = '';
  if (courses.length === 0) {
    coursesHtml = `
      <div class="empty-state">
        <div class="emoji">📚</div>
        <div class="text">这个学期还没有课程</div>
        <div class="sub">点击下方按钮添加你的第一门课</div>
      </div>
    `;
  } else {
    coursesHtml = courses.map((c, i) => {
      const mastery = getCourseMastery(c.id);
      const topics = getCourseTopics(c.id);
      const examStatus = getExamStatus(c.examDate);
      return `
        <div class="course-card stagger-${Math.min(i+1,6)}" style="--course-color:${c.color}" onclick="navigateToCourse('${c.id}')">
          <div class="course-card-header">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="course-dot" style="background:${c.color}"></span>
              <span class="course-name">${esc(c.name)}</span>
            </div>
            ${examStatus ? `<span class="exam-badge ${examStatus.cls}">📅 ${examStatus.label}</span>` : ''}
          </div>
          ${topics.length > 0 ? `
            <div class="course-meta">
              ${topics.length} 个主题 · ${topics.reduce((s,t) => s + getTopicTests(t.id).length, 0)} 次检测
            </div>
          ` : `
            <div class="course-meta">还没有关联的自测主题</div>
          `}
          <div class="course-stats">
            <div class="course-stat"><strong style="color:${scoreColor(mastery)}">${mastery}</strong>掌握度</div>
            <div class="course-stat"><strong>${topics.length}</strong>主题数</div>
            <div class="course-stat"><strong>${topics.reduce((s,t) => s + getTopicTests(t.id).length, 0)}</strong>检测数</div>
          </div>
        </div>
      `;
    }).join('');
  }

  return `
    <div class="card stagger-1">
      <div class="flex-between">
        <div>
          <div style="font-size:20px;font-weight:800">📅 课程表</div>
          <div class="text-xs text-faint mt-8">按学期管理课程，关联自测主题</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="showAddCourse()">+ 添加课程</button>
      </div>
    </div>
    <div class="semester-tabs stagger-1">${semesterTabsHtml}</div>
    ${coursesHtml}
  `;
}

function switchSemester(semesterId) {
  state.currentSemester = semesterId;
  navigate('schedule');
}

function showAddSemester() {
  const html = `
    <div class="form-group">
      <label class="form-label">学期名称</label>
      <input class="form-input" id="new-semester-name" placeholder="如：2026秋、大三上" autofocus>
    </div>
  `;
  showModal('添加学期', html, [
    { label: '取消', cls: 'btn-secondary' },
    { label: '添加', cls: 'btn-primary', onClick: () => {
      const name = document.getElementById('new-semester-name')?.value.trim();
      if (!name) { toast('请输入学期名称'); return; }
      const sem = { id: uid(), name };
      state.semesters.push(sem);
      state.currentSemester = sem.id;
      saveState();
      navigate('schedule');
      toast('学期已添加');
    }}
  ]);
}

function renderCourseTrendChart(allTests) {
  const sorted = [...allTests].sort((a,b) => a.date - b.date).slice(-15);
  const chartW = 620, chartH = 100, padX = 20, padY = 15;
  const plotW = chartW - padX * 2, plotH = chartH - padY * 2;
  const points = sorted.map((t, i) => ({
    x: padX + (sorted.length === 1 ? plotW/2 : (i / (sorted.length - 1)) * plotW),
    y: padY + (1 - t.score / 100) * plotH,
    score: t.score, type: t.type, date: t.date
  }));
  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const areaD = pathD ? `${pathD} L ${points[points.length-1]?.x} ${padY+plotH} L ${points[0]?.x} ${padY+plotH} Z` : '';
  const typeColors = { feynman: 'var(--accent)', recall: 'var(--primary)', quiz: 'var(--success)' };
  return `
    <div class="trend-chart stagger-2">
      <div class="trend-chart-header">
        <div class="trend-chart-title">📈 成绩趋势</div>
        <div class="text-xs text-faint">${sorted.length} 次检测</div>
      </div>
      <svg class="trend-chart-svg" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="courseTrendGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--primary)" stop-opacity=".15"/>
            <stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="${padX}" y1="${padY}" x2="${chartW-padX}" y2="${padY}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="${padX}" y1="${padY + plotH/2}" x2="${chartW-padX}" y2="${padY + plotH/2}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="${padX}" y1="${padY+plotH}" x2="${chartW-padX}" y2="${padY+plotH}" stroke="var(--border)" stroke-width="1"/>
        ${areaD ? `<path d="${areaD}" fill="url(#courseTrendGrad)"/>` : ''}
        ${pathD ? `<path d="${pathD}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
        ${points.map(p => `
          <circle cx="${p.x}" cy="${p.y}" r="5" fill="var(--card)" stroke="${typeColors[p.type]}" stroke-width="2.5"/>
        `).join('')}
      </svg>
    </div>
  `;
}

function editCourse(courseId) {

function renderOverview() {
  const topics = getAllTopics();
  const allTests = getAllTests();

  if (topics.length === 0 && Object.keys(state.courses).length === 0) {
    return `
      <div class="card stagger-1">
        <div class="empty-state">
          <div class="emoji">📊</div>
